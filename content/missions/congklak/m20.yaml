# Congklak mission 20 — Juara Papan
#
# Board indices (5 pits per side, 12 cells):
#   0        player 2's store (lumbung)
#   1-5      player 2's row
#   6        player 1's store  ← the student
#   7-11     player 1's row
#
# Distance to the student's store: pit 11 is 6 steps, 10 is 7, 9 is 8, 8 is 9,
# 7 is 10 — the opponent's store at index 0 is skipped.

id: congklak.m20
game: congklak
rank: 20
contentVersion: 1
eloDifficulty: 1800
seed: 1020

skillWeights:
  algo.optimization: 0.4
  algo.lookahead: 0.3
  algo.state-eval: 0.2
  algo.greedy: 0.1

rationale: >-
  The strongest opponent searches ahead, so winning means searching the space of sows for the best line rather than the first acceptable one.

goal:
  kind: outscore

setup:
  game: congklak
  playerSide: 1
  toMove: 1
  pits: [0, 7, 7, 7, 7, 7, 7, 7, 0, 7, 7, 7, 7, 7, 7, 7]

constraints:
  maxMoves: 80
  aiTier: sulit

config:
  extraTurnOnStore: true
  captureEnabled: true
  continuationEnabled: true
  sweepOnEnd: true

titleKey: mission.congklak.m20.title
briefKey: mission.congklak.m20.brief
hintKeys:
  - mission.congklak.m20.hint1
failureKeys:
  outscored: mission.congklak.m20.fail.outscored
