# Congklak mission 02 — Dua Biji
#
# Board indices (5 pits per side, 12 cells):
#   0        player 2's store (lumbung)
#   1-5      player 2's row
#   6        player 1's store  ← the student
#   7-11     player 1's row
#
# Distance to the student's store: pit 11 is 6 steps, 10 is 7, 9 is 8, 8 is 9,
# 7 is 10 — the opponent's store at index 0 is skipped.

id: congklak.m02
game: congklak
rank: 2
contentVersion: 1
eloDifficulty: 850
seed: 1002

skillWeights:
  comp.arithmetic: 0.5
  comp.counting: 0.3
  comp.modular: 0.2

rationale: >-
  Reaching two seeds means accumulating into the lumbung across two sows, which is repeated addition toward a target.

goal:
  kind: collect
  count: 2

setup:
  game: congklak
  playerSide: 1
  toMove: 1
  pits: [0, 2, 2, 2, 2, 2, 0, 0, 0, 0, 7, 6]

constraints:
  maxMoves: 8
  parMoves: 2

config:
  extraTurnOnStore: true
  captureEnabled: false
  continuationEnabled: false
  sweepOnEnd: true

titleKey: mission.congklak.m02.title
briefKey: mission.congklak.m02.brief
hintKeys:
  - mission.congklak.m02.hint1
failureKeys:
  notEnough: mission.congklak.m02.fail.notEnough
