# Congklak mission 09 — Enam Biji
#
# Board indices (5 pits per side, 12 cells):
#   0        player 2's store (lumbung)
#   1-5      player 2's row
#   6        player 1's store  ← the student
#   7-11     player 1's row
#
# Distance to the student's store: pit 11 is 6 steps, 10 is 7, 9 is 8, 8 is 9,
# 7 is 10 — the opponent's store at index 0 is skipped.

id: congklak.m09
game: congklak
rank: 9
contentVersion: 1
eloDifficulty: 1000
seed: 1009

skillWeights:
  comp.arithmetic: 0.5
  algo.lookahead: 0.3
  algo.state-eval: 0.2

rationale: >-
  Collecting six seeds inside three sows requires chains that pass the lumbung more than once, so the student must predict accumulation rather than count it after.

goal:
  kind: within
  moves: 3
  goal:
    kind: collect
    count: 6

setup:
  game: congklak
  playerSide: 1
  toMove: 1
  pits: [0, 3, 3, 3, 3, 3, 0, 6, 7, 8, 9, 10]

constraints:
  maxMoves: 6
  parMoves: 3

config:
  extraTurnOnStore: true
  captureEnabled: false
  continuationEnabled: true
  sweepOnEnd: true

titleKey: mission.congklak.m09.title
briefKey: mission.congklak.m09.brief
hintKeys:
  - mission.congklak.m09.hint1
failureKeys:
  outOfMoves: mission.congklak.m09.fail.outOfMoves
