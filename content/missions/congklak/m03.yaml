# Congklak mission 03 — Giliran Lagi
#
# Board indices (5 pits per side, 12 cells):
#   0        player 2's store (lumbung)
#   1-5      player 2's row
#   6        player 1's store  ← the student
#   7-11     player 1's row
#
# Distance to the student's store: pit 11 is 6 steps, 10 is 7, 9 is 8, 8 is 9,
# 7 is 10 — the opponent's store at index 0 is skipped.

id: congklak.m03
game: congklak
rank: 3
contentVersion: 1
eloDifficulty: 900
seed: 1003

skillWeights:
  algo.branching: 0.65
  comp.modular: 0.35

rationale: >-
  The extra turn is a conditional that fires only when the last seed lands in the store, so the student must pick the pit whose distance matches.

goal:
  kind: extra_turns
  count: 1

setup:
  game: congklak
  playerSide: 1
  toMove: 1
  pits: [0, 2, 2, 2, 2, 2, 0, 0, 0, 3, 0, 6]

constraints:
  maxMoves: 6
  parMoves: 1

config:
  extraTurnOnStore: true
  captureEnabled: false
  continuationEnabled: false
  sweepOnEnd: true

titleKey: mission.congklak.m03.title
briefKey: mission.congklak.m03.brief
hintKeys:
  - mission.congklak.m03.hint1
failureKeys:
  noExtra: mission.congklak.m03.fail.noExtra
