# Congklak mission 01 — Sebar Pertama
#
# Board indices (5 pits per side, 12 cells):
#   0        player 2's store (lumbung)
#   1-5      player 2's row
#   6        player 1's store  ← the student
#   7-11     player 1's row
#
# Distance to the student's store: pit 11 is 6 steps, 10 is 7, 9 is 8, 8 is 9,
# 7 is 10 — the opponent's store at index 0 is skipped.

id: congklak.m01
game: congklak
rank: 1
contentVersion: 1
eloDifficulty: 800
seed: 1001

skillWeights:
  comp.counting: 0.65
  algo.sequencing: 0.35

rationale: >-
  The student must count the seeds in a pit and see which count reaches the lumbung exactly.

goal:
  kind: collect
  count: 1

setup:
  game: congklak
  playerSide: 1
  toMove: 1
  pits: [0, 2, 2, 2, 2, 2, 0, 1, 0, 0, 0, 6]

constraints:
  maxMoves: 6
  parMoves: 1

config:
  extraTurnOnStore: true
  captureEnabled: false
  continuationEnabled: false
  sweepOnEnd: true

titleKey: mission.congklak.m01.title
briefKey: mission.congklak.m01.brief
hintKeys:
  - mission.congklak.m01.hint1
failureKeys:
  ranOut: mission.congklak.m01.fail.ranOut
