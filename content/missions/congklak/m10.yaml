# Congklak mission 10 — Tembakan Pertama
#
# Board indices (5 pits per side, 12 cells):
#   0        player 2's store (lumbung)
#   1-5      player 2's row
#   6        player 1's store  ← the student
#   7-11     player 1's row
#
# Distance to the student's store: pit 11 is 6 steps, 10 is 7, 9 is 8, 8 is 9,
# 7 is 10 — the opponent's store at index 0 is skipped.

id: congklak.m10
game: congklak
rank: 10
contentVersion: 1
eloDifficulty: 1250
seed: 1010

skillWeights:
  algo.lookahead: 0.5
  comp.modular: 0.3
  comp.counting: 0.2

rationale: >-
  The capture fires only when the final seed lands in an empty pit on the student own side, so the landing position has to be worked out first.

goal:
  kind: capture
  count: 1

setup:
  game: congklak
  playerSide: 1
  toMove: 1
  pits: [0, 0, 0, 0, 5, 0, 0, 1, 0, 0, 0, 0]

constraints:
  maxMoves: 6
  parMoves: 1

config:
  extraTurnOnStore: true
  captureEnabled: true
  continuationEnabled: false
  sweepOnEnd: true

titleKey: mission.congklak.m10.title
briefKey: mission.congklak.m10.brief
hintKeys:
  - mission.congklak.m10.hint1
failureKeys:
  noCapture: mission.congklak.m10.fail.noCapture
