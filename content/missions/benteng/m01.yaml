# Benteng mission m01 — Sentuh Benteng
#
# Grid coordinates: x rightwards, y downwards. The student's base is at the
# bottom, the opponent's at the top.
#
# Freshness is `turn - lastTouchedBaseOnTurn`; lower is stronger, and a unit may
# only capture one whose freshness is strictly higher than its own. `freshness`
# below is how stale a unit already is at turn zero.

id: benteng.m01
game: benteng
rank: 1
contentVersion: 1
eloDifficulty: 800
seed: 2001

skillWeights:
  sec.assets: 0.65
  algo.sequencing: 0.35

rationale: >-
  Both sides start equally fresh, so nobody can capture anybody. The board and the objective without the rule mattering yet.

goal:
  kind: reach_base

setup:
  game: benteng
  width: 5
  height: 5
  toMove: 1
  bases:
    - { side: 1, x: 2, y: 4 }
    - { side: 2, x: 2, y: 0 }
  units:
    - { id: p1, side: 1, x: 2, y: 4 }
    - { id: e1, side: 2, x: 0, y: 0 }

constraints:
  maxMoves: 8
  parMoves: 4
  aiTier: mudah

config:
  freshnessWindow: 0

titleKey: mission.benteng.m01.title
briefKey: mission.benteng.m01.brief
hintKeys:
  - mission.benteng.m01.hint1
failureKeys:
  ranOut: mission.benteng.m01.fail.ranOut
