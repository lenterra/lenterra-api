# Benteng mission m06 — Umpan
#
# Grid coordinates: x rightwards, y downwards. The student's base is at the
# bottom, the opponent's at the top.
#
# Freshness is `turn - lastTouchedBaseOnTurn`; lower is stronger, and a unit may
# only capture one whose freshness is strictly higher than its own. `freshness`
# below is how stale a unit already is at turn zero.

id: benteng.m06
game: benteng
rank: 6
contentVersion: 1
eloDifficulty: 1300
seed: 2006

skillWeights:
  sec.threats: 0.5
  sec.risk: 0.3
  algo.lookahead: 0.2

rationale: >-
  Two units, one route. Drawing the defender out of position is the only way through, and doing it means accepting risk on purpose.

goal:
  kind: reach_base

setup:
  game: benteng
  width: 5
  height: 5
  toMove: 1
  bases:
    - { side: 1, x: 2, y: 4 }
    - { side: 2, x: 2, y: 0 }
  units:
    - { id: p1, side: 1, x: 1, y: 3 }
    - { id: p2, side: 1, x: 3, y: 3 }
    - { id: e1, side: 2, x: 2, y: 1, freshness: 1 }
    - { id: e2, side: 2, x: 2, y: 0 }

constraints:
  maxMoves: 14
  parMoves: 6
  aiTier: sedang

config:
  freshnessWindow: 0

titleKey: mission.benteng.m06.title
briefKey: mission.benteng.m06.brief
hintKeys:
  - mission.benteng.m06.hint1
failureKeys:
  blocked: mission.benteng.m06.fail.blocked
