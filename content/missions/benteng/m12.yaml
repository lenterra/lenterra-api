# Benteng mission m12 — Lawan Tangguh
#
# Grid coordinates: x rightwards, y downwards. The student's base is at the
# bottom, the opponent's at the top.
#
# Freshness is `turn - lastTouchedBaseOnTurn`; lower is stronger, and a unit may
# only capture one whose freshness is strictly higher than its own. `freshness`
# below is how stale a unit already is at turn zero.

id: benteng.m12
game: benteng
rank: 12
contentVersion: 1
eloDifficulty: 1750
seed: 2012

skillWeights:
  sec.risk: 0.4
  sec.threats: 0.25
  sec.defense: 0.2
  algo.optimization: 0.15

rationale: >-
  The same board against an opponent searching three moves ahead. Four units against three, because a defence that keeps a fresh unit on its base has to be outnumbered before the base can be reached.

goal:
  kind: reach_base

setup:
  game: benteng
  width: 5
  height: 5
  toMove: 1
  bases:
    - { side: 1, x: 2, y: 4 }
    - { side: 2, x: 2, y: 0 }
  units:
    - { id: p1, side: 1, x: 0, y: 4 }
    - { id: p2, side: 1, x: 1, y: 4 }
    - { id: p3, side: 1, x: 3, y: 4 }
    - { id: p4, side: 1, x: 4, y: 4 }
    - { id: e1, side: 2, x: 1, y: 0 }
    - { id: e2, side: 2, x: 2, y: 0 }
    - { id: e3, side: 2, x: 3, y: 0 }

constraints:
  maxMoves: 22
  parMoves: 15
  aiTier: sulit

config:
  freshnessWindow: 0

# The intended solution, replayed by content validation.
# Search is not tractable here: several units with four directions each, and a
# goal that is only satisfied at full depth, so there is nothing to prune on.
# Writing the line down proves the mission is winnable, documents the intent
# for review, and fails the build the day a rules change breaks it.
referenceLine:
  - { kind: move, unitId: p1, x: 0, y: 3 }
  - { kind: move, unitId: p1, x: 0, y: 2 }
  - { kind: move, unitId: p1, x: 0, y: 1 }
  - { kind: move, unitId: p1, x: 0, y: 0 }
  - { kind: move, unitId: p1, x: 0, y: 1 }
  - { kind: move, unitId: p1, x: 0, y: 2 }
  - { kind: move, unitId: p1, x: 0, y: 1 }
  - { kind: move, unitId: p2, x: 1, y: 3 }
  - { kind: move, unitId: p2, x: 1, y: 2 }
  - { kind: move, unitId: p2, x: 0, y: 2 }
  - { kind: move, unitId: p3, x: 2, y: 4 }
  - { kind: move, unitId: p3, x: 2, y: 3 }
  - { kind: move, unitId: p3, x: 2, y: 2 }
  - { kind: move, unitId: p3, x: 2, y: 1 }
  - { kind: move, unitId: p3, x: 2, y: 0 }

titleKey: mission.benteng.m12.title
briefKey: mission.benteng.m12.brief
hintKeys:
  - mission.benteng.m12.hint1
failureKeys:
  lost: mission.benteng.m12.fail.lost
