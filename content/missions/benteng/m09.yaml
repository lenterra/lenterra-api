# Benteng mission m09 — Bebaskan Kawan
#
# Grid coordinates: x rightwards, y downwards. The student's base is at the
# bottom, the opponent's at the top.
#
# Freshness is `turn - lastTouchedBaseOnTurn`; lower is stronger, and a unit may
# only capture one whose freshness is strictly higher than its own. `freshness`
# below is how stale a unit already is at turn zero.

id: benteng.m09
game: benteng
rank: 9
contentVersion: 1
eloDifficulty: 1500
seed: 2009

skillWeights:
  sec.response: 0.6
  algo.sequencing: 0.2
  sec.risk: 0.2

rationale: >-
  A unit is already a prisoner. Recovering it costs tempo and exposes the rescuer — detection is only half of a response.

goal:
  kind: reach_base

setup:
  game: benteng
  width: 7
  height: 7
  toMove: 1
  bases:
    - { side: 1, x: 3, y: 6 }
    - { side: 2, x: 3, y: 0 }
  units:
    - { id: p1, side: 1, x: 3, y: 6 }
    - { id: p2, side: 1, x: 3, y: 5 }
    - { id: p3, side: 1, x: 2, y: 4, captured: true }
    - { id: e1, side: 2, x: 1, y: 1, freshness: 2 }
    - { id: e2, side: 2, x: 5, y: 1, freshness: 2 }

constraints:
  maxMoves: 22
  parMoves: 10
  aiTier: sedang

config:
  freshnessWindow: 0

titleKey: mission.benteng.m09.title
briefKey: mission.benteng.m09.brief
hintKeys:
  - mission.benteng.m09.hint1
failureKeys:
  lost: mission.benteng.m09.fail.lost
