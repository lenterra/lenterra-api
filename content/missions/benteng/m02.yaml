# Benteng mission m02 — Siapa Lebih Segar
#
# Grid coordinates: x rightwards, y downwards. The student's base is at the
# bottom, the opponent's at the top.
#
# Freshness is `turn - lastTouchedBaseOnTurn`; lower is stronger, and a unit may
# only capture one whose freshness is strictly higher than its own. `freshness`
# below is how stale a unit already is at turn zero.

id: benteng.m02
game: benteng
rank: 2
contentVersion: 1
eloDifficulty: 900
seed: 2002

skillWeights:
  sec.access: 0.7
  algo.state-eval: 0.3

rationale: >-
  One enemy is three turns stale and the student is fresh. The first position where the freshness rule does anything at all.

goal:
  kind: capture_units
  count: 1

setup:
  game: benteng
  width: 5
  height: 5
  toMove: 1
  bases:
    - { side: 1, x: 2, y: 4 }
    - { side: 2, x: 2, y: 0 }
  units:
    - { id: p1, side: 1, x: 2, y: 3 }
    - { id: e1, side: 2, x: 2, y: 2, freshness: 3 }
    - { id: e2, side: 2, x: 0, y: 0 }

constraints:
  maxMoves: 6
  parMoves: 1
  aiTier: mudah

config:
  freshnessWindow: 0

titleKey: mission.benteng.m02.title
briefKey: mission.benteng.m02.brief
hintKeys:
  - mission.benteng.m02.hint1
failureKeys:
  tooStale: mission.benteng.m02.fail.tooStale
