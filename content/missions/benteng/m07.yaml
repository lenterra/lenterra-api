# Benteng mission m07 — Dua Ancaman
#
# Grid coordinates: x rightwards, y downwards. The student's base is at the
# bottom, the opponent's at the top.
#
# Freshness is `turn - lastTouchedBaseOnTurn`; lower is stronger, and a unit may
# only capture one whose freshness is strictly higher than its own. `freshness`
# below is how stale a unit already is at turn zero.

id: benteng.m07
game: benteng
rank: 7
contentVersion: 1
eloDifficulty: 1350
seed: 2007

skillWeights:
  sec.defense: 0.65
  algo.state-eval: 0.35

rationale: >-
  Two attackers on separate paths. One defending unit cannot cover both, so the student reads which approach actually threatens the base and which is a feint.

goal:
  kind: defend_base
  turns: 10

setup:
  game: benteng
  width: 5
  height: 5
  toMove: 1
  bases:
    - { side: 1, x: 2, y: 4 }
    - { side: 2, x: 2, y: 0 }
  units:
    - { id: p1, side: 1, x: 2, y: 4 }
    - { id: p2, side: 1, x: 1, y: 3 }
    - { id: e1, side: 2, x: 0, y: 1, freshness: 1 }
    - { id: e2, side: 2, x: 4, y: 1, freshness: 1 }
    - { id: e3, side: 2, x: 2, y: 1, freshness: 1 }

constraints:
  maxMoves: 20
  parMoves: 10
  aiTier: sedang

config:
  freshnessWindow: 0

# The intended solution, replayed by content validation.
# Search is not tractable here: several units with four directions each, and a
# goal that is only satisfied at full depth, so there is nothing to prune on.
# Writing the line down proves the mission is winnable, documents the intent
# for review, and fails the build the day a rules change breaks it.
referenceLine:
  - { kind: move, unitId: p1, x: 2, y: 3 }
  - { kind: move, unitId: p1, x: 2, y: 2 }
  - { kind: move, unitId: p1, x: 1, y: 2 }
  - { kind: move, unitId: p1, x: 1, y: 1 }
  - { kind: move, unitId: p1, x: 1, y: 0 }
  - { kind: move, unitId: p1, x: 0, y: 0 }
  - { kind: move, unitId: p1, x: 0, y: 1 }
  - { kind: move, unitId: p1, x: 0, y: 0 }
  - { kind: move, unitId: p2, x: 1, y: 2 }
  - { kind: move, unitId: p2, x: 0, y: 2 }

titleKey: mission.benteng.m07.title
briefKey: mission.benteng.m07.brief
hintKeys:
  - mission.benteng.m07.hint1
failureKeys:
  baseTaken: mission.benteng.m07.fail.baseTaken
